<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d34e2c"/>
      <stop offset="100%" stop-color="#992c10"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#f7b045"/>
      <stop offset="50%" stop-color="#ffd5a8"/>
      <stop offset="100%" stop-color="#fff4e6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="100" ry="100" fill="none" stroke="#e59324" stroke-width="4" opacity="0.25"/>
  <!-- Flame icon (matching Lucide Flame style) -->
  <g transform="translate(256,268) scale(7.2)" filter="url(#glow)">
    <path d="M12 2C6.5 6.5 3 11 3 15a9 9 0 0 0 18 0c0-4-3.5-8.5-9-13Z" 
          fill="url(#flame)" stroke="none" transform="translate(-12,-14)"/>
    <path d="M12 12c-2 2-3 4-3 6a3 3 0 0 0 6 0c0-2-1-4-3-6Z" 
          fill="#d34e2c" opacity="0.7" stroke="none" transform="translate(-12,-14)"/>
  </g>
</svg>
